name: Mutation test

# テストの検出力 (ミュータントを検出できるか) を測る。
# 実行時間が長いため通常の PR CI には含めず、週次と手動で実行する。
# 閾値で落とさず、スコアと生き残ったミュータントをジョブサマリーと artifact に出す。
on:
  schedule:
    - cron: '23 18 * * 0' # 毎週月曜 03:23 JST
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mutation-test.yaml'
      - '.github/scripts/mutation_summary.py'
      - 'backend/build.gradle'
      - 'frontend/stryker.config.mjs'

permissions:
  contents: read

concurrency:
  group: mutation-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java (PIT)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-provider: basic

      - name: Run PIT
        run: ./gradlew pitest

      - name: Summary
        if: always()
        run: |
          if [ -f build/reports/pitest/mutations.xml ]; then
            python3 ../.github/scripts/mutation_summary.py pit build/reports/pitest/mutations.xml >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pitest-report
          path: backend/build/reports/pitest/

  frontend:
    name: TypeScript (StrykerJS)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Enable pnpm via corepack
        run: |
          corepack enable pnpm
          corepack install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Configure pnpm cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 前回結果を再利用し、変更のないコードとテストのミュータントは再実行しない
      - name: Restore incremental result
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: frontend/reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ github.ref_name }}-
            stryker-incremental-main-

      - name: Run StrykerJS
        run: pnpm mutation --incremental

      - name: Summary
        if: always()
        run: |
          if [ -f reports/mutation/mutation.json ]; then
            python3 ../.github/scripts/mutation_summary.py stryker reports/mutation/mutation.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stryker-report
          path: frontend/reports/mutation/
