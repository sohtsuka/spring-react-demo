spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${DB_USERNAME:appuser}
    password: ${DB_PASSWORD:apppassword}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  session:
    timeout: ${SESSION_TIMEOUT:1800}s

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

app:
  security:
    pepper: ${APP_PEPPER}
    # アプリの手前にある信頼できるリバースプロキシの段数。
    # 0 = プロキシ無し (X-Forwarded-For を信用しない)。N 段のときは XFF の右から N 番目を
    # クライアント IP として使うため、攻撃者が前方に足した値では レート制限を迂回できない。
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
